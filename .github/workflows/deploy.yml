name: Test and deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test (unit and browser tests)
        run: dotnet test -c Release
      - name: Publish (stamped with this deploy's version)
        run: |
          export APP_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          export APP_COMMIT="${GITHUB_SHA::7}"
          export APP_RELEASED="$(date -u +%F)"
          scripts/publish.sh "$RUNNER_TEMP/out" "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
